<!-- ============ ОБОИ В СТИЛЕ TELEGRAM iOS: ЧЁРНЫЙ ФОН + ЛИНЕЙНЫЕ ДУДЛЫ ============ -->
<div id="wall" aria-hidden="true">
  <div id="lightglow"></div>

      <pattern id="pat" width="264" height="264" patternUnits="userSpaceOnUse">

          <use href="#ic-tree"    x="10"  y="10"  width="34" height="34" transform="rotate(-8 27 27)"/>
          <use href="#ic-flake"   x="84"  y="26"  width="28" height="28" transform="rotate(10 98 40)"/>

          <use href="#ic-bell"    x="30"  y="82"  width="30" height="30" transform="rotate(12 45 97)"/>
          <use href="#ic-candy"   x="104" y="88"  width="32" height="32" transform="rotate(-10 120 104)"/>
          <use href="#ic-snowman" x="176" y="84"  width="32" height="32" transform="rotate(8 192 100)"/>

          <use href="#ic-sock"    x="34"  y="216" width="28" height="28" transform="rotate(-10 48 230)"/>
          <use href="#ic-mug"     x="104" y="218" width="28" height="28" transform="rotate(8 118 232)"/>
          <use href="#ic-moon"    x="168" y="220" width="26" height="26" transform="rotate(-14 181 233)"/>
          <use href="#ic-heart"   x="226" y="214" width="22" height="22" transform="rotate(14 237 225)"/>
          <circle cx="66"  cy="64"  r="2" fill="currentColor"/>
          <circle cx="134" cy="62"  r="1.6" fill="currentColor"/>
          <circle cx="196" cy="58"  r="1.8" fill="currentColor"/>
          <circle cx="68"  cy="132" r="1.6" fill="currentColor"/>
          <circle cx="150" cy="140" r="2" fill="currentColor"/>
          <circle cx="238" cy="150" r="1.6" fill="currentColor"/>
          <circle cx="16"  cy="136" r="1.8" fill="currentColor"/>
          <circle cx="86"  cy="206" r="1.6" fill="currentColor"/>
          <circle cx="160" cy="204" r="1.8" fill="currentColor"/>
          <circle cx="248" cy="196" r="1.4" fill="currentColor"/>
          <circle cx="14"  cy="250" r="1.8" fill="currentColor"/>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#pat)"/>
  </svg>
  <div id="vig"></div>
</div>
<canvas id="snowBack" aria-hidden="true"></canvas>

<!-- ============ ПРИЛОЖЕНИЕ ============ -->
<div id="app">
  <header id="topbar">
    <div class="ad" id="adLogo">
      <svg class="logo"><use href="#logo"/></svg>
      <div class="ad-txt">
        <span class="ad-tag">реклама</span>
        <b class="ad-bot" id="botName">Emoji Studio</b>
      </div>
    </div>
    <div class="chips">
      <button class="chip" data-action="goto" data-tab="profile" title="Баланс"><svg class="i gold"><use href="#ic-star"/></svg><b id="chipBalance">0</b></button>
      <button class="chip" data-action="goto" data-tab="profile" title="Кристаллы"><i class="gem-i"></i><b id="chipCrystals">0</b></button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <div id="catslot"><div id="cat" aria-hidden="true"></div></div>
  <nav id="tabbar">
    <button class="tab" data-action="goto" data-tab="create"><svg class="i"><use href="#ic-create"/></svg><span>Создать</span></button>
    <button class="tab" data-action="goto" data-tab="shop"><svg class="i"><use href="#ic-shop"/></svg><span>Магазин</span></button>
    <button class="tab" data-action="goto" data-tab="profile"><svg class="i"><use href="#ic-profile"/></svg><span>Профиль</span></button>
    <button class="tab" data-action="goto" data-tab="more"><svg class="i"><use href="#ic-more"/></svg><span>Прочее</span></button>
  </nav>
</div>

<svg id="garland" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"></svg>
<canvas id="snowFront" aria-hidden="true"></canvas>

<div id="sheetRoot"></div>
<div id="introRoot"></div>
<div id="fx" aria-hidden="true"></div>
<div id="toast" role="status"></div>
